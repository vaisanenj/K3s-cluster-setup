apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-app
spec:
  refreshInterval: "60m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-db-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      property: DB_APP_USER
      key: immich
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      property: DB_APP_PASS
      key: immich
      metadataPolicy: None