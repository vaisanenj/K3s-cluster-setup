apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  imageName: ghcr.io/immich-app/postgres:16-vectorchord1.1.1-pgvector0.8.5
  instances: 1
  #Dont allow pods to be run same nodes
  affinity: 
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    shared_preload_libraries:
      - "vchord.so"  
  storage:
    storageClass: longhorn-strict-local-1-replica
    size: 5Gi
  managed:
    roles:
     - name: immich
       ensure: present
       connectionLimit: -1
       inherit: true
       login: true
       #Immich needs to be superuser rights to generate db dumps
       superuser: true
       passwordSecret:
         name: db-app-user
  bootstrap:
    initdb:
      database: immich
      owner: immich        
      dataChecksums: true
      postInitApplicationSQL:
        - GRANT ALL PRIVILEGES ON DATABASE immich TO immich;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vectors CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
        - GRANT USAGE ON SCHEMA vectors TO immich;