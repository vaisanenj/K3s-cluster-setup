apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wireguard
spec:
  replicas: 1
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
#      labels:
#        recurring-job.longhorn.io/daily-backup: enabled
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: longhorn-best-effort
      resources:
        requests:
          storage: 32Mi
  template:
    spec:
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "200Mi"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SERVERURL
              value: ddns.vaisanen.cloud
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "3"
            - name: PEERDNS
              value: 192.168.20.1
            - name: LOG_CONFS
              value: "true"
          volumeMounts:
            - mountPath: /config
              subPath: config
              name: data
            - mountPath: /lib/modules
              subPath: lib
              name: data