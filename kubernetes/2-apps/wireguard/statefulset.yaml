apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "200Mi"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SERVERURL
              value: ddns.vaisanen.cloud
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "3"
            - name: PEERDNS
              value: 192.168.20.1
            - name: LOG_CONFS
              value: "true"