apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-hassio
spec:
  entryPoints:
    - local-https
    - local-http
  routes:
  - kind: Rule
    match: Host(`hassio.k3s.internal`)
    services:
    - kind: Service
      name: svc-homeassistant
      port: 8123
  - kind: Rule
    match: Host(`zigbee2mqtt.k3s.internal`)
    services:
    - kind: Service
      name: svc-zigbee2mqtt
      port: 8080
  tls:
    secretName: automation-certificate-secret
