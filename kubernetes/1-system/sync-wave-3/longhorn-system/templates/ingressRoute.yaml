apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - local-https
    - local-http
  routes:
  - kind: Rule
    match: Host(`longhorn.k3s.internal`)
    services:
    - kind: Service
      name: longhorn-frontend
      port: 80